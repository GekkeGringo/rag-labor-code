[project]
name = "rag-labor-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GekkeGringo", email = "gekke_gringo@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "nltk>=3.10.3",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-labor-code = "rag_labor_code:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
